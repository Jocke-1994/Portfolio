name: Update GitHub Graph Backup

on:
  schedule:
    # Körs kl 00:00 varje söndag
    - cron: '0 0 * * 0'
  # Gör det möjligt att köra den manuellt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Download new graph image
        run: |
          # Laddar ner grafen som SVG med din lila färgkod (6366f1)
          curl -o images/github-static.svg "https://ghchart.rshah.org/6366f1/Jocke-1994"

      - name: Check if image changed
        id: check_changes
        run: |
          # Kollar om filen ändrats (nu mot .svg)
          if [[ -n $(git status -s images/github-static.svg) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # Lägger till den nya SVG-filen
          git add images/github-static.svg
          git commit -m "Auto-update GitHub contribution graph"
          git push